version: '3.8'
services:
  sqlserver2:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver2
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyPgsDb123
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "MyPgsDb123", "-Q", "SELECT 1" ]
      interval: 10s
      retries: 5
      start_period: 30s  # Wait 30 seconds before starting health checks
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr & 
      tail -f /dev/null
      "

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver2:1433;databaseName=pgsDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: MyPgsDb123
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.SQLServerDialect
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8085
      TWILIO_ACCOUNT_SID: ACa4a43badb4ea62bd6a9173ce6ad36543
      TWILIO_AUTH_TOKEN: d466cbf27bf02624d8e0994705a8c85d
      TWILIO_TRIAL_NUMBER: +14845467140
    ports:
      - "8085:8085"
    depends_on:
      sqlserver2:
        condition: service_healthy

  init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      sqlserver2:
        condition: service_healthy
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - SA_PASSWORD=MyPgsDb123
    command: /bin/bash -c "/opt/mssql-tools/bin/sqlcmd -S sqlserver2 -U sa -P MyPgsDb123 -Q 'CREATE DATABASE pgsDB'"
    restart: "no"

volumes:
  sqlserver-data:
