version: '3.8'
services:
  sqlserver2:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver2  # Name your new SQL Server container differently
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyPgsDb123
      - MSSQL_PID=Express
    ports:
      - "1434:1433"  # Map container's port 1433 to host's port 1434
    volumes:
      - sqlserver-data:/var/opt/mssql
  app:
    build: .
    image: supplychaintracking:4.1
    container_name : supplychaintracking
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver2:1433;databaseName=pgsDB;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: MyPgsDb123
      SPRING_JPA_HIBERNATE_DIALECT: org.hibernate.dialect.SQLServerDialect
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8085
      TWILIO_ACCOUNT_SID: ACa4a43badb4ea62bd6a9173ce6ad36543
      TWILIO_AUTH_TOKEN: d466cbf27bf02624d8e0994705a8c85d
      TWILIO_TRIAL_NUMBER: +14845467140
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_ENDPOINT_METRICS_ENABLED: "true"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: "/actuator"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWED_ORIGINS: "*"
      MANAGEMENT_ENDPOINTS_WEB_CORS_ALLOWED_METHODS: "GET,POST"
    ports:
      - "8085:8085"
    depends_on:
      - sqlserver2

volumes:
  sqlserver-data:
